[Service]
# The source is a root-owned raw value beneath a mode-0700 directory. systemd
# copies it into the service-private credential directory read by Caddy's
# runtime {file.*} placeholder.
LoadCredential=oauth-proxy-authenticator:/etc/slopproof/secrets/current/oauth-proxy-authenticator

# Never use the distribution unit's `--environ`: it prints the complete
# service environment to the journal. The only environment value here is the
# non-secret, local Unix admin address.
Environment=CADDY_ADMIN=unix//run/caddy/admin.sock
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile --address unix//run/caddy/admin.sock

RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
UMask=0077
LimitCORE=0
