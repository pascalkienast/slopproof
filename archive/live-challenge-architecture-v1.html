<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SlopProof Live-Challenge-Architektur</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }
  main {
    max-width: 1200px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title { font-size: 22px; font-weight: 700; fill: var(--fg); }
  .subtitle { font-size: 13px; fill: var(--muted); }
  .zone-label { font-size: 12px; font-weight: 700; fill: var(--muted); letter-spacing: 0.05em; }
  .label { font-size: 14px; font-weight: 650; fill: var(--fg); }
  .small { font-size: 12px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1.2; rx: 10; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
  .edge-label { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; rx: 14; }
</style>
<main>
  <svg viewBox="0 0 1200 690" role="img" aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">SlopProof Live-Challenge-Architektur</title>
    <desc id="diagram-desc">Ein Pull Request durchläuft GitHub App, Diff-Analyse, zeitgebundene Live Challenge, Bewertung und einen SHA-gebundenen GitHub Check. Contributor, Maintainer und private Speicher sind darunter angeordnet.</desc>

    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--line)" />
      </marker>
    </defs>

    <text x="28" y="36" class="title">SlopProof · Live Challenge</text>
    <text x="28" y="58" class="subtitle">SHA-gebundener Verständnisnachweis ohne KI-Detektion oder Webcam-Proctoring</text>

    <rect x="205" y="88" width="790" height="375" class="zone" />
    <text x="222" y="112" class="zone-label">SLOPPROOF CONTROL PLANE</text>

    <rect x="320" y="490" width="565" height="150" class="zone" />
    <text x="337" y="514" class="zone-label">PRIVATE DATENZONE</text>

    <!-- Main flow -->
    <path d="M175 185 L225 185" class="edge" marker-end="url(#arrow)" />
    <path d="M365 185 L410 185" class="edge" marker-end="url(#arrow)" />
    <path d="M550 185 L595 185" class="edge" marker-end="url(#arrow)" />
    <path d="M735 185 L780 185" class="edge" marker-end="url(#arrow)" />
    <path d="M920 185 L1025 185" class="edge" marker-end="url(#arrow)" />
    <text x="190" y="171" class="edge-label">Webhook</text>
    <text x="370" y="171" class="edge-label">Diff</text>
    <text x="556" y="171" class="edge-label">Fragenpool</text>
    <text x="742" y="171" class="edge-label">Antworten</text>
    <text x="944" y="171" class="edge-label">Verdict</text>

    <!-- Human interaction -->
    <path d="M665 235 L665 335" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <text x="677" y="277" class="edge-label">Frage · Nonce · Timer</text>
    <text x="677" y="295" class="edge-label">Artefakt · Follow-up</text>

    <path d="M850 235 L850 335" class="edge" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <text x="862" y="279" class="edge-label">Grenzfall</text>
    <text x="862" y="297" class="edge-label">Entscheidung</text>

    <!-- Private state and media -->
    <path d="M625 235 C585 360 515 430 455 530" class="edge" marker-end="url(#arrow)" />
    <text x="508" y="422" class="edge-label">State · Audit · Jobs</text>

    <path d="M820 235 C730 370 620 430 495 530" class="edge" marker-end="url(#arrow)" />
    <text x="652" y="413" class="edge-label">Evaluation</text>

    <path d="M620 425 C655 470 700 495 745 530" class="edge" marker-end="url(#arrow)" />
    <text x="622" y="479" class="edge-label">Presigned Upload</text>

    <path d="M795 530 C835 455 845 360 845 235" class="edge" marker-end="url(#arrow)" />
    <text x="814" y="443" class="edge-label">privates Medium</text>

    <!-- Main flow nodes -->
    <rect x="35" y="140" width="140" height="90" class="node external" />
    <text x="105" y="174" text-anchor="middle" class="label">GitHub PR</text>
    <text x="105" y="195" text-anchor="middle" class="small">Autor · Head-SHA</text>
    <text x="105" y="212" text-anchor="middle" class="small">Push invalidiert</text>

    <rect x="225" y="140" width="140" height="90" class="node process" />
    <text x="295" y="174" text-anchor="middle" class="label">GitHub App</text>
    <text x="295" y="195" text-anchor="middle" class="small">Webhook · OAuth</text>
    <text x="295" y="212" text-anchor="middle" class="small">Check Publisher</text>

    <rect x="410" y="140" width="140" height="90" class="node neutral" />
    <text x="480" y="174" text-anchor="middle" class="label">Diff Analyzer</text>
    <text x="480" y="195" text-anchor="middle" class="small">Fragen + Rubrik</text>
    <text x="480" y="212" text-anchor="middle" class="small">read-only</text>

    <rect x="595" y="140" width="140" height="95" class="node process" />
    <text x="665" y="170" text-anchor="middle" class="label">Challenge</text>
    <text x="665" y="188" text-anchor="middle" class="label">Orchestrator</text>
    <text x="665" y="210" text-anchor="middle" class="small">Nonce · Timer · State</text>
    <text x="665" y="226" text-anchor="middle" class="small">SHA-Revalidierung</text>

    <rect x="780" y="140" width="140" height="95" class="node neutral" />
    <text x="850" y="174" text-anchor="middle" class="label">Judge</text>
    <text x="850" y="195" text-anchor="middle" class="small">Regeln · OCR</text>
    <text x="850" y="212" text-anchor="middle" class="small">Pass / Review / Retry</text>

    <rect x="1025" y="140" width="145" height="90" class="node external" />
    <text x="1098" y="174" text-anchor="middle" class="label">GitHub Check</text>
    <text x="1098" y="195" text-anchor="middle" class="small">SHA-gebunden</text>
    <text x="1098" y="212" text-anchor="middle" class="small">Required Rule</text>

    <!-- Humans -->
    <rect x="575" y="335" width="180" height="90" class="node input" />
    <text x="665" y="365" text-anchor="middle" class="label">Contributor</text>
    <text x="665" y="386" text-anchor="middle" class="small">Papier · Audio · Video</text>
    <text x="665" y="403" text-anchor="middle" class="small">oder Live-Text</text>

    <rect x="780" y="335" width="140" height="90" class="node external" />
    <text x="850" y="370" text-anchor="middle" class="label">Maintainer</text>
    <text x="850" y="391" text-anchor="middle" class="small">Review · Override</text>
    <text x="850" y="408" text-anchor="middle" class="small">keine Medien öffentlich</text>

    <!-- Data stores -->
    <rect x="350" y="530" width="190" height="85" class="node storage" />
    <text x="445" y="563" text-anchor="middle" class="label">Postgres</text>
    <text x="445" y="584" text-anchor="middle" class="small">State · Policy · Audit</text>
    <text x="445" y="601" text-anchor="middle" class="small">Postgres Job Queue</text>

    <rect x="700" y="530" width="190" height="85" class="node storage" />
    <text x="795" y="563" text-anchor="middle" class="label">Private Object Store</text>
    <text x="795" y="584" text-anchor="middle" class="small">Foto · Audio · Video</text>
    <text x="795" y="601" text-anchor="middle" class="small">verschlüsselt · 24h</text>

    <rect x="225" y="652" width="750" height="26" class="node risk" />
    <text x="600" y="670" text-anchor="middle" class="small">Kein PR-Code im MVP · kein Human-Proof-Versprechen · Unsicherheit geht an Maintainers</text>
  </svg>
</main>
