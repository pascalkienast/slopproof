name: slopproof-production

x-app-build: &app-build
  context: .
  args:
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set the exact public R2 endpoint}

x-app-image: &app-image ${SLOPPROOF_IMAGE:-slopproof-app:production}

x-app-hardening: &app-hardening
  image: *app-image
  build: *app-build
  user: "1000:1000"
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_signal: SIGTERM

x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-no-core: &no-core
  core:
    soft: 0
    hard: 0

# Gate 9 Mobileup envelope, observed read-only on 2026-08-13: 2 vCPU,
# 3.73 GiB RAM (3,819 MiB rounded down), no swap, with native Caddy and other
# sites sharing the host. Long-running hard limits total 1.5 CPU/2,368 MiB.
# Counting migrate as a deliberately conservative upgrade overlap raises that
# to 1.75 CPU/2,752 MiB, leaving 0.25 CPU and 1,067 MiB for the host, Docker and
# cohosted services. tmpfs and PostgreSQL shm usage are charged inside these
# cgroup ceilings, and memswap_limit equals mem_limit for every service. The
# dependency graph completes migrate before any new-release long-running
# application process starts; the overlap budget covers the old release.

services:
  postgres:
    image: ${SLOPPROOF_POSTGRES_IMAGE:-postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15}
    user: "70:70"
    environment:
      POSTGRES_DB: slopproof
      POSTGRES_USER: slopproof
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - source: postgres_password
        target: postgres-password
    volumes:
      - type: bind
        source: ${SLOPPROOF_DATA_DIR:-/var/lib/slopproof-production}/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70,mode=1770
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70,mode=3770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U slopproof -d slopproof"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s
    cpus: 0.375
    mem_limit: 640m
    memswap_limit: 640m
    pids_limit: 256
    shm_size: 128m
    logging: *bounded-logging
    ulimits: *no-core

  migrate:
    <<: *app-hardening
    command: ["node", "scripts/migrate-db.mjs"]
    environment:
      SLOPPROOF_ENV_FILE: /run/secrets/migrate.env
    secrets:
      - source: migrate_environment
        target: migrate.env
    networks:
      - backend
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    stop_grace_period: 30s
    cpus: 0.25
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    logging: *bounded-logging
    ulimits: *no-core

  worker:
    <<: *app-hardening
    command: ["node", "apps/worker/dist/index.cjs"]
    environment:
      SLOPPROOF_ENV_FILE: /run/secrets/worker.env
    secrets:
      - source: worker_environment
        target: worker.env
      - source: wrapping_private_key
        target: wrapping-private.pem
    networks:
      - backend
      - egress
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1000,gid=1000,mode=1770
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:4001/healthz", {
          signal: AbortSignal.timeout(2500) }).then((response) => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 45s
    cpus: 0.75
    mem_limit: 896m
    memswap_limit: 896m
    pids_limit: 256
    logging: *bounded-logging
    ulimits: *no-core

  github-control:
    <<: *app-hardening
    command: ["node", "apps/github-control/dist/index.cjs"]
    environment:
      SLOPPROOF_ENV_FILE: /run/secrets/github-control.env
    secrets:
      - source: github_control_environment
        target: github-control.env
      - source: github_private_key
        target: github-app.pem
    networks:
      - backend
      - egress
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:4002/healthz", {
          signal: AbortSignal.timeout(2500) }).then((response) => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 0.125
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    logging: *bounded-logging
    ulimits: *no-core

  web:
    <<: *app-hardening
    command: ["node", "apps/web/server.js"]
    environment:
      SLOPPROOF_ENV_FILE: /run/secrets/web.env
    secrets:
      - source: web_environment
        target: web.env
      - source: wrapping_public_key
        target: wrapping-public.pem
    networks:
      - backend
      - egress
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=1770
      - /app/apps/web/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0750
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
      github-control:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/api/health/ready", {
          signal: AbortSignal.timeout(2500) }).then((response) => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 0.25
    mem_limit: 576m
    memswap_limit: 576m
    pids_limit: 256
    logging: *bounded-logging
    ulimits: *no-core

networks:
  backend:
    internal: true
  egress: {}

secrets:
  web_environment:
    file: ${SLOPPROOF_SECRET_DIR:-/etc/slopproof/secrets}/web.env
  worker_environment:
    file: ${SLOPPROOF_SECRET_DIR:-/etc/slopproof/secrets}/worker.env
  github_control_environment:
    file: ${SLOPPROOF_SECRET_DIR:-/etc/slopproof/secrets}/github-control.env
  migrate_environment:
    file: ${SLOPPROOF_SECRET_DIR:-/etc/slopproof/secrets}/migrate.env
  github_private_key:
    file: ${SLOPPROOF_SECRET_DIR:-/etc/slopproof/secrets}/github-app.pem
  wrapping_private_key:
    file: ${SLOPPROOF_SECRET_DIR:-/etc/slopproof/secrets}/wrapping-private.pem
  wrapping_public_key:
    file: ${SLOPPROOF_SECRET_DIR:-/etc/slopproof/secrets}/wrapping-public.pem
  postgres_password:
    file: ${SLOPPROOF_SECRET_DIR:-/etc/slopproof/secrets}/postgres-password
