name: slopproof

x-app-build: &app-build
  context: .
  args:
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}

x-app-image: &app-image slopproof-app:local

x-app-environment: &app-environment
  NODE_ENV: production
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  DATABASE_URL: postgres://slopproof:${POSTGRES_PASSWORD:-slopproof-local-only}@postgres:5432/slopproof
  GITHUB_ADAPTER: fake
  EVIDENCE_STORAGE_PROVIDER: s3
  S3_REGION: us-east-1
  S3_BUCKET: slopproof-evidence
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-slopproof-local}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-slopproof-local-storage-secret}
  S3_CONTROL_ENDPOINT: http://object-store:7070
  KEY_WRAPPING_PROVIDER: local
  TRANSCRIPTION_PROVIDER: fake
  MULTIMODAL_JUDGE_PROVIDER: fake
  LOG_LEVEL: info
  WORKER_INTERNAL_SECRET: ${WORKER_INTERNAL_SECRET:-local-worker-secret-change-me-000000}
  DEMO_MODE: "true"
  DEMO_FAKE_MEDIA: "false"

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: slopproof
      POSTGRES_USER: slopproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slopproof-local-only}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slopproof -d slopproof"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  object-store:
    image: versity/versitygw:v1.4.1
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-slopproof-local}
      ROOT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-slopproof-local-storage-secret}
      VGW_PORT: ":7070"
      VGW_IAM_DIR: /data/iam
      VGW_VERSIONING_DIR: /data/versioning
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:9000:7070"
    volumes:
      - object-data:/data/s3
      - object-iam:/data/iam
      - object-versioning:/data/versioning
    restart: unless-stopped

  keys:
    image: *app-image
    build: *app-build
    user: "0:0"
    command:
      - node
      - scripts/generate-dev-keys.mjs
      - /run/slopproof-public/wrapping-public.pem
      - /run/slopproof-private/wrapping-private.pem
    volumes:
      - wrapping-public-key:/run/slopproof-public
      - wrapping-private-key:/run/slopproof-private
    restart: "no"

  migrate:
    image: *app-image
    build: *app-build
    command: ["corepack", "pnpm", "db:migrate"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: *app-image
    build: *app-build
    command: ["corepack", "pnpm", "db:seed"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  storage-init:
    image: *app-image
    build: *app-build
    command: ["node", "infra/docker/init-storage.mjs"]
    environment:
      <<: *app-environment
      S3_ALLOWED_ORIGIN: ${APP_BASE_URL:-http://localhost:3000}
    depends_on:
      object-store:
        condition: service_started
    restart: "no"

  web:
    image: *app-image
    build: *app-build
    command:
      - corepack
      - pnpm
      - --filter
      - "@slopproof/web"
      - exec
      - next
      - start
      - --hostname
      - 0.0.0.0
    environment:
      <<: *app-environment
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-me-00000}
      GITHUB_APP_ID: fake-local
      GITHUB_PRIVATE_KEY: fake-local-never-used
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-local-webhook-secret-change-me-0000}
      GITHUB_CLIENT_ID: fake-local
      GITHUB_CLIENT_SECRET: fake-local
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      KEY_WRAPPING_PUBLIC_KEY_PATH: /run/slopproof-public/wrapping-public.pem
      WORKER_INTERNAL_URL: http://worker:4001
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - wrapping-public-key:/run/slopproof-public:ro
    depends_on:
      keys:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: *app-image
    build: *app-build
    command: ["node", "apps/worker/dist/index.cjs"]
    init: true
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    environment:
      <<: *app-environment
      KEY_WRAPPING_PRIVATE_KEY_PATH: /run/slopproof-private/wrapping-private.pem
      PROVIDER_PAYLOAD_KEY_BASE64: ${PROVIDER_PAYLOAD_KEY_BASE64:-cHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHA=}
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: 4001
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    volumes:
      - wrapping-private-key:/run/slopproof-private:ro
    depends_on:
      keys:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  object-data:
  object-iam:
  object-versioning:
  wrapping-public-key:
  wrapping-private-key:
